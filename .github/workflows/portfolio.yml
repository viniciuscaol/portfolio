name: Portfolio CI e Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validar e preparar site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Baixar código
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Preparar Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Conferir JavaScript
        run: node --check assets/main.js
      - name: Conferir referências e preparar arquivos públicos
        run: python scripts/build_site.py
      - name: Empacotar site para Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: portfolio-pages-production
      cancel-in-progress: false
    steps:
      - name: Publicar versão aprovada
        id: deployment
        uses: actions/deploy-pages@v5.0.1
